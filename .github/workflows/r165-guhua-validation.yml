            for(const p of [...bounded,...heavy,...extras]) {
              assert.match(p,/^tests\/[A-Za-z0-9_./-]+\.test\.mjs$/);
              assert.ok(!p.split('/').includes('..'));
              assert.ok(fs.lstatSync(p).isFile(),p);
              git('ls-files','--error-unmatch','--',p);
            }
            assert.ok(heavy.every(p=>!bounded.includes(p)));
