          import {registerHooks} from 'node:module';
          import {sourceFingerprint,createBuildInfo} from './scripts/build-identity.mjs';

          const evidence=process.env.EVIDENCE_DIR;
          fs.mkdirSync(evidence,{recursive:true});
          const write=(name,value)=>fs.writeFileSync(path.join(evidence,name),JSON.stringify(value,null,2)+'\n');
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const sha=p=>createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          // Informational local freeze label, never required as a remote Git object.
