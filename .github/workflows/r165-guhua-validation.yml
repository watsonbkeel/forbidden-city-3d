name: R165 Guhua read-only validation

# Branch-specific CI only. This file never deploys or modifies repository refs.
"on":
  push:
    branches:
      - dev/r165-guhua-rolled-roof-20261105

# Declaring this mapping sets every unspecified permission to none.
permissions:
  contents: read

concurrency:
  group: r165-guhua-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'watsonbkeel/forbidden-city-3d' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev/r165-guhua-rolled-roof-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      GIT_OPTIONAL_LOCKS: "0"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"

    steps:
      - name: Check out the exact event commit and baseline history
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select the exact registerHooks-capable Node toolchain
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
          check-latest: false

      - name: Validate frozen source, run every test serially, and build
        id: validation
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/r165-guhua-validation
        run: |
          node --input-type=module - <<'NODE'
