name: R165 cumulative read-only validation

# Branch-specific CI only. This file never deploys or modifies repository refs.
"on":
  push:
    branches:
      - dev/r165-cumulative-367-20261105

# Declaring this mapping sets every unspecified permission to none.
permissions:
  contents: read

concurrency:
  group: r165-cumulative-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'watsonbkeel/forbidden-city-3d' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev/r165-cumulative-367-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
