          ];
          for(const spec of commands) {
            for(const dir of Object.values(spec.env??{}))
              if(dir.startsWith(evidence+path.sep))fs.mkdirSync(dir,{recursive:true});
            const expectedTests={'actual-ningshou':1,'actual-west-six':1,'actual-outer-west':1,'actual-yangxin-west-six':1,'r48-full-west-six-mock-extra':1,'r48-full-west-six-production-extra':1,'r48-full-outer-west-mock-extra':1,'r48-full-outer-west-production-extra':1,'r42-component-extra-3':3,'r42-history-status-extra-2':2,
              'r42-full-ningshou-10hz-extra':1,'r42-full-ningshou-60hz-extra':1,'r139-guhua-frozen-extra-5':5}[spec.name];
            state.commands.push({...spec,fileCount:spec.args.filter(a=>a.startsWith('tests/')&&a.endsWith('.test.mjs')).length,expectedTests,status:'not_run'});
          }
          write('results.json',state);
          let setupFailed=false;
          for(const receipt of state.commands) {
            if(setupFailed) {receipt.reason='A required setup command failed; dependent checks were not run.';continue;}
            receipt.status='running';receipt.startedAt=new Date().toISOString();
            receipt.log=receipt.name+'.log';write('results.json',state);
            console.log('\nCOMMAND '+JSON.stringify({command:receipt.command,args:receipt.args,env:receipt.env??{}}));
            const log=fs.createWriteStream(path.join(evidence,receipt.log));
            log.write('COMMAND '+JSON.stringify({command:receipt.command,args:receipt.args,env:receipt.env??{}})+'\n');
            const start=performance.now();
            const result=await new Promise(resolve=>{
              const child=spawn(receipt.command,receipt.args,{env:{...process.env,...receipt.env},
                stdio:['ignore','pipe','pipe']});
              let spawnError;
              child.stdout.on('data',chunk=>{log.write(chunk);process.stdout.write(chunk);});
              child.stderr.on('data',chunk=>{log.write(chunk);process.stderr.write(chunk);});
              child.on('error',error=>{spawnError=error.stack;log.write(error.stack+'\n');console.error(error);});
              child.on('close',(code,signal)=>resolve({code,signal,error:spawnError}));
            });
            await new Promise(resolve=>log.end(resolve));
            Object.assign(receipt,result,{status:result.code===0&&!result.signal&&!result.error?'passed':'failed',
              durationMs:Math.round(performance.now()-start),completedAt:new Date().toISOString()});
            if(receipt.fileCount>0) {
              const tap=fs.readFileSync(path.join(evidence,receipt.log),'utf8');
              receipt.tapTotals=Object.fromEntries(['tests','pass','fail','cancelled','skipped','todo'].map(key=>{
                const matches=[...tap.matchAll(new RegExp('^# '+key+' (\\d+)$','gm'))];
                return [key,matches.length?Number(matches.at(-1)[1]):null];
              }));
              if(receipt.tapTotals.pass===null||receipt.tapTotals.fail!==0||receipt.tapTotals.cancelled!==0||receipt.tapTotals.todo!==0
                ||(receipt.category.startsWith('formal-')&&receipt.tapTotals.skipped!==0)
                ||(receipt.expectedTests!==undefined&&receipt.tapTotals.pass!==receipt.expectedTests)) {
                receipt.status='failed';receipt.receiptError='Missing/inconsistent TAP totals, unexpected pending tests, or selected-case pass count mismatch.';
              }
            }
            console.log('R165_COMMAND_RESULT_JSON '+JSON.stringify(receipt));
            write('results.json',state);
            if(receipt.category==='setup'&&receipt.status!=='passed')setupFailed=true;
          }
          state.completedAt=new Date().toISOString();
          state.status=state.commands.every(r=>r.status==='passed')?'passed':'failed';
          write('results.json',state);
          console.log(JSON.stringify({status:state.status,commands:state.commands.map(({name,status,code,signal})=>({name,status,code,signal}))},null,2));
          if(state.status!=='passed')process.exitCode=1;
          NODE

      - name: Preserve receipts, available dist, step outcomes, and checksums
        id: collect
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/r165-cumulative-validation
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const root=process.env.EVIDENCE_DIR;
          fs.mkdirSync(root,{recursive:true});
          fs.writeFileSync(path.join(root,'step-outcomes.json'),JSON.stringify({
            checkout:process.env.CHECKOUT_OUTCOME,node:process.env.NODE_OUTCOME,
            validation:process.env.VALIDATION_OUTCOME,runId:process.env.GITHUB_RUN_ID,
            runAttempt:process.env.GITHUB_RUN_ATTEMPT,head:process.env.GITHUB_SHA,
            note:'A missing or partial dist is not a passing build. Platform action logs remain in the GitHub Actions run.'
          },null,2)+'\n');
          if(fs.existsSync('dist'))fs.cpSync('dist',path.join(root,'dist'),{recursive:true});
          const rows=[],manifest=[];
          function visit(relative='') {
            for(const entry of fs.readdirSync(path.join(root,relative),{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name))) {
              const p=path.posix.join(relative,entry.name);
              if(entry.isDirectory())visit(p);
              else if(entry.isFile()&&p!=='CHECKSUMS.sha256') {
                const bytes=fs.readFileSync(path.join(root,p)),sha256=createHash('sha256').update(bytes).digest('hex');
                rows.push(sha256+'  '+p);manifest.push({path:p,bytes:bytes.length,sha256});
              }
              else if(!entry.isFile())throw Error('Unexpected non-regular artifact entry: '+p);
            }
          }
          visit();
          fs.writeFileSync(path.join(root,'CHECKSUMS.sha256'),rows.join('\n')+'\n');
          const summary={head:process.env.GITHUB_SHA,manifestedFiles:manifest.length,manifestedTotalBytes:manifest.reduce((n,r)=>n+r.bytes,0),
            excludes:['CHECKSUMS.sha256','artifact-manifest.json'],
            distFiles:manifest.filter(r=>r.path.startsWith('dist/')).length,distBytes:manifest.filter(r=>r.path.startsWith('dist/')).reduce((n,r)=>n+r.bytes,0),manifest};
          const manifestBytes=JSON.stringify(summary,null,2)+'\n';
          fs.writeFileSync(path.join(root,'artifact-manifest.json'),manifestBytes);
          fs.appendFileSync(path.join(root,'CHECKSUMS.sha256'),createHash('sha256').update(manifestBytes).digest('hex')+'  artifact-manifest.json\n');
          console.log('R165_ARTIFACT_MANIFEST_JSON '+JSON.stringify(summary));
          console.log('Recorded '+rows.length+' artifact file checksums.');
          NODE

      - name: Upload validation evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r165-cumulative-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r165-cumulative-validation/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
