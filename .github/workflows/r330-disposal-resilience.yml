name: R330 triad disposal fault isolation and ordinary build (no deploy)
'on':
  push:
    branches:
    - dev/r330-disposal-resilience
permissions:
  contents: read
concurrency:
  group: r330-disposal-resilience-one-shot
  cancel-in-progress: false
jobs:
  review:
    if: ${{ github.repository == 'watsonbkeel/forbidden-city-3d' && github.event_name == 'push' && github.ref == 'refs/heads/dev/r330-disposal-resilience' && github.event.created == true && github.event.deleted == false && github.event.forced == false && github.event.before == '0000000000000000000000000000000000000000' && github.run_number == 1 && github.run_attempt == 1 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      NPM_CONFIG_USERCONFIG: /dev/null
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Initialize external one-shot evidence
      env:
        REVIEW_RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: 'set -euo pipefail

        test "$REVIEW_RUNNER_ENVIRONMENT" = ''github-hosted''

        EVIDENCE_DIR="$RUNNER_TEMP/r330-disposal-resilience-evidence"

        mkdir "$EVIDENCE_DIR"

        GLOBAL_NPM_CONFIG="$RUNNER_TEMP/r265-empty-global.npmrc"

        (set -C; : > "$GLOBAL_NPM_CONFIG")

        chmod 444 "$GLOBAL_NPM_CONFIG"

        printf ''EVIDENCE_DIR=%s\nNPM_CONFIG_GLOBALCONFIG=%s\nREVIEW_RUNNER_ENVIRONMENT=%s\n'' "$EVIDENCE_DIR" "$GLOBAL_NPM_CONFIG" "$REVIEW_RUNNER_ENVIRONMENT" >> "$GITHUB_ENV"

        '
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        fetch-depth: 2
        persist-credentials: false
    - name: Verify exact main parent, changed paths and frozen input bytes
      run: 'set -euo pipefail

        python3 - <<''PYINNER''

        from pathlib import Path

        import json,subprocess,hashlib,os

        p=json.loads(Path(''tests/r330-disposal/pins.json'').read_text())

        def git(*a):return subprocess.check_output([''git'',*a],text=True).strip()

        assert p[''frozen''] is True and p[''parent'']==''60cf4277b3a7f1e2912a54fbc35c13a1130db4a6''

        head=git(''rev-parse'',''HEAD'');assert head==os.environ[''GITHUB_SHA''];assert git(''rev-list'',''--parents'',''-n'',''1'',''HEAD'').split()==[head,p[''parent'']]

        assert git(''rev-parse'',''HEAD^:'')==p[''parentTree'']

        assert git(''status'',''--porcelain=v1'',''--untracked-files=all'')==''''

        changes=[line.split(''\t'') for line in git(''diff'',''--name-status'',''HEAD^'',''HEAD'').splitlines()];assert changes==p[''changes'']

        for name,want in p[''sourcePins''].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==want,name

        for name,want in p[''retainedPins''].items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==want,name

        assert not Path(''dist'').exists()

        e=Path(os.environ[''EVIDENCE_DIR'']);e.joinpath(''checkout-identity.json'').write_text(json.dumps({''head'':head,''tree'':git(''rev-parse'',''HEAD^{tree}''),''parent'':p[''parent''],''parentTree'':p[''parentTree''],''changes'':changes,''sourcePins'':p[''sourcePins''],''retainedPins'':p[''retainedPins''],''pinsSHA256'':hashlib.sha256(Path(''tests/r330-disposal/pins.json'').read_bytes()).hexdigest(),''scope'':''EXCEPTION_CLEANUP_AND_ORDINARY_BUILD_NOT_CDP_COLD_RETURN_OR_VISUAL_ACCEPTANCE''},indent=2) + chr(10))

        PYINNER'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.1
        check-latest: false
        cache: npm
    - name: Install unchanged locked dependencies on hosted runner only
      run: 'set -euo pipefail

        test "$(node --version)" = ''v24.22.1''

        test "$(npm --version)" = ''11.19.1''

        { node --version; npm --version; cat /etc/os-release; printf ''ImageOS=%s\nImageVersion=%s\n'' "$ImageOS" "$ImageVersion"; } > "$EVIDENCE_DIR/toolchain.txt"

        npm ci 2>&1 | tee "$EVIDENCE_DIR/npm-ci.log"

        '
    - name: New actual owner failure regression (no browser)
      run: 'set -euo pipefail

        timeout --signal=TERM --kill-after=5s 60s node --max-old-space-size=256 --max-semi-space-size=8 tests/r330-disposal/run.mjs

        '
    - name: Existing focused session and manager lifecycle regressions only
      run: "set -euo pipefail\ntimeout --signal=TERM --kill-after=5s 90s node --max-old-space-size=512 --max-semi-space-size=16 --test --test-concurrency=1 tests/r275-buddha-original/triad-presentation.test.mjs tests/r262-cold-release.test.mjs tests/r262-material-listener.test.mjs tests/r169-dafotang-photo-triptych/cache-lifecycle.test.mjs 2>&1 | tee \"$EVIDENCE_DIR/focused-regressions.log\"\nfor expected in 'tests 55' 'pass 55' 'fail 0' 'skipped 0' 'cancelled 0'; do grep -Fx \"\u2139 $expected\" \"$EVIDENCE_DIR/focused-regressions.log\"; done\n"
    - name: Original ordinary production build guard, no budget relaxation
      id: production
      run: "set -euo pipefail\ntest -z \"$(git status --porcelain=v1 --untracked-files=all)\"\npython3 .github/scripts/r177_build_bound.py 2>&1 | tee \"$EVIDENCE_DIR/ordinary-build-admission.log\"\npython3 - <<'PYINNER'\nfrom pathlib import Path\nimport json,hashlib,os\np=Path('dist');assert p.is_dir();files=[]\nfor f in sorted(p.rglob('*')):\n if f.is_file():\n  assert not f.is_symlink();b=f.read_bytes();files.append({'path':str(f.relative_to(p)),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})\nassert files\nPath(os.environ['EVIDENCE_DIR'],'ordinary-build-manifest.json').write_text(json.dumps({'head':os.environ['GITHUB_SHA'],'base':'/forbidden-city-3d/','files':files},indent=2) + chr(10))\nPYINNER"
    - name: Preserve ordinary build only if all preceding checks succeeded
      if: success()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r330-ordinary-build-${{ github.sha }}
        path: dist/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    - name: Preserve all successful and failed verification evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r330-disposal-evidence-${{ github.sha }}
        path: ${{ env.EVIDENCE_DIR }}/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
